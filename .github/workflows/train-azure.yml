name: Train On Azure ML

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
      AZURE_ML_WORKSPACE: ${{ secrets.AZURE_ML_WORKSPACE }}
      REGISTERED_MODEL_NAME: btc-direction-model
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Install Azure ML CLI v2
        run: |
          az extension add -n ml -y || az extension update -n ml

      - name: Set workspace defaults
        run: |
          az configure --defaults group=$AZURE_RESOURCE_GROUP workspace=$AZURE_ML_WORKSPACE

      - name: Create compute if needed
        run: az ml compute create --file azureml/compute/cpu-cluster.yml

      - name: Register environment
        run: az ml environment create --file azureml/environments/training-env.yml

      - name: Submit Azure ML pipeline
        run: |
          az ml job create \
            --file azureml/pipelines/train_register_score.yml \
            --set inputs.registered_model_name=$REGISTERED_MODEL_NAME
