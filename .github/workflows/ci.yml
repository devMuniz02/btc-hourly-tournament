name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch
          pip install --no-cache-dir -r requirements-btc.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate Azure ML asset layout
        run: |
          test -f azureml/pipelines/train_register_score.yml
          test -f azureml/endpoints/btc-direction-endpoint.yml
          test -f azureml/endpoints/btc-direction-deployment.yml
