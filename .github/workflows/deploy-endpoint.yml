name: Deploy Azure ML Endpoint

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
      AZURE_ML_WORKSPACE: ${{ secrets.AZURE_ML_WORKSPACE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Install Azure ML CLI v2
        run: |
          az extension add -n ml -y || az extension update -n ml

      - name: Set workspace defaults
        run: |
          az configure --defaults group=$AZURE_RESOURCE_GROUP workspace=$AZURE_ML_WORKSPACE

      - name: Register environment
        run: az ml environment create --file azureml/environments/training-env.yml

      - name: Create endpoint
        run: az ml online-endpoint create --file azureml/endpoints/btc-direction-endpoint.yml

      - name: Deploy latest model
        run: |
          az ml online-deployment create \
            --file azureml/endpoints/btc-direction-deployment.yml \
            --all-traffic
