$schema: https://azuremlschemas.azureedge.net/latest/managedOnlineDeployment.schema.json
name: blue
endpoint_name: btc-direction-endpoint
model: azureml:btc-direction-model:2
instance_type: Standard_DS2_v2
instance_count: 1
environment: azureml:btc-azure-mlops-env:3
code_configuration:
  code: ./code
  scoring_script: score.py
request_settings:
  request_timeout_ms: 120000
  max_concurrent_requests_per_instance: 1
liveness_probe:
  initial_delay: 30
readiness_probe:
  initial_delay: 30
